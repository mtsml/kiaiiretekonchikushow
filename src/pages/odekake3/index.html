<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="人型3Dモデルのポーズ変更を確認する検証ページ">
  <link rel="icon" href="../../assets/favicon.ico">
  <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
  <link rel="stylesheet" href="../../global.css">
  <link rel="stylesheet" href="./style.css">
  <title>3Dポーズ検証 | めぐ島</title>
</head>
<body>
  <header>
    <nav class="c-breadcrumb"><a href="../_root/index.html">← めぐ島🏝️</a></nav>
    <h1>3Dポーズ検証</h1>
  </header>

  <main>
    <p>VRM 1.0 の Humanoid モデルを読み込み、自然言語のポーズ指定を反映する検証ページです。</p>

    <section class="viewer-panel" aria-label="3Dモデル表示">
      <div id="viewer" class="viewer" aria-label="3Dモデルを読み込み中"></div>
      <p id="status" class="status" role="status">モデルを読み込んでいます…</p>
    </section>

    <section class="controls" aria-label="モデルとポーズの操作">
      <label class="file-input" for="model-file">
        <span>モデルを選択</span>
        <input id="model-file" type="file" multiple accept=".vrm,.glb,.gltf,.bin,.png,.jpg,.jpeg,.webp,model/gltf-binary,model/gltf+json">
      </label>
      <p class="hint">未配置時は Astra 出力の .vrm / .glb を選択できます。.gltf は .bin・テクスチャもまとめて選択してください。</p>

      <div class="preset-buttons" aria-label="ポーズのプリセット">
        <button type="button" data-pose="initial">初期ポーズ</button>
        <button type="button" data-pose="right-arm-up">右腕を上げる</button>
        <button type="button" data-pose="left-arm-up">左腕を上げる</button>
        <button type="button" data-pose="both-arms-up">両腕を上げる</button>
      </div>
    </section>

    <section class="pose-input" aria-label="自然言語でポーズを指定">
      <h2>自然言語でポーズ指定</h2>
      <form id="pose-form">
        <label for="pose-prompt">ポーズの指示</label>
        <textarea id="pose-prompt" rows="2" maxlength="500">右手でピースして少し前かがみ</textarea>
        <button id="pose-submit" type="submit">ポーズを適用</button>
      </form>
      <p id="pose-status" class="status" role="status">入力例を送信できます。</p>
      <pre id="pose-result" class="pose-result" hidden></pre>
    </section>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/",
        "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.4.0/lib/three-vrm.module.min.js"
      }
    }
  </script>
  <script type="module" src="./script.js"></script>
</body>
</html>
