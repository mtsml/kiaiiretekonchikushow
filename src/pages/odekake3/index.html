<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="人型3Dモデルのポーズ変更を確認する検証ページ">
  <link rel="icon" href="../../assets/favicon.ico">
  <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
  <link rel="stylesheet" href="../../global.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <title>おでかけハロめぐ3D | めぐ島</title>
</head>
<body>
  <header>
    <nav class="c-breadcrumb">
      <a href="../_root/index.html">
        <!-- ChevronLeft Icon -->
        <svg class="c-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512"><!--!Font Awesome Free 6.5.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.--><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l192 192c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L77.3 256 246.6 86.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-192 192z"/></svg>
        <span>めぐ島🏝️</span>
      </a>
    </nav>
    <h1>おでかけハロめぐ3D</h1>
  </header>

  <main>
    <section class="viewer-panel" aria-label="3Dモデル表示">
      <div id="viewer" class="viewer" aria-label="3Dモデルを読み込み中"></div>
    </section>

    <section class="pose-input" aria-label="自然言語でポーズを指定">
      <form id="pose-form">
        <textarea id="pose-prompt" rows="2" maxlength="500" aria-label="ポーズの指示" placeholder="ポーズを入力">右手でピースして少し前かがみ</textarea>
        <button id="pose-submit" type="submit">ポーズを適用</button>
      </form>
      <button id="ar-launch" class="ar-launch" type="button" hidden>このポーズをARで見る</button>
    </section>
  </main>

  <model-viewer id="ar-viewer" class="ar-viewer" ar ar-modes="scene-viewer quick-look" camera-controls alt="ポーズを適用した3Dキャラクター"></model-viewer>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/",
        "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.4.0/lib/three-vrm.module.min.js"
      }
    }
  </script>
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
  <script type="module" src="./script.js"></script>
</body>
</html>
